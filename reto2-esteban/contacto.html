<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Contacto — Esteban Malpassi</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="contenedora">
        <header id="logo">
            <div class="header-inner">
                <div class="header-left">
                    <img class="foto-cv" src="esteban.jpeg" alt="Foto de Esteban">
                    <div class="header-text">
                        <h1>Esteban Malpassi</h1>
                        <p>Contacto</p>
                    </div>
                </div>
            </div>
        </header>

        <nav id="menu">
            <ul>
                <li><a href="index.html#perfil">Perfil</a></li>
                <li><a href="about.html">Sobre</a></li>
                <li><a href="habilidad.html">Habilidades</a></li>
                <li><a href="educacion.html">Educación</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>

        <main id="contenido">
            <section id="contacto-main" class="section">
                <h1>Contacto</h1>
                <p>Correo: e.malpassi@itecriocuarto.org.ar</p>
                <form action="#" method="post">
                    <label>
                        Nombre
                        <input type="text" name="name" placeholder="Nombre">
                    </label>
                    <label>
                        Correo
                        <input type="email" name="email" placeholder="correo">
                    </label>
                    <label>
                        Mensaje
                        <textarea name="message" placeholder="mensaje"></textarea>
                    </label>
                    <button type="submit">Enviar</button>
                </form>
            </section>
        </main>

        <aside id="lateral">
            <section class="section">
                <h2>Información adicional</h2>
                <p>Teléfono: +54 9 358 ...</p>
            </section>
        </aside>

        <div id="limpiar"></div>

        <footer id="pie">
            <p>© 2026 Esteban Malpassi</p>
        </footer>
    </div>
</body>
</html>
